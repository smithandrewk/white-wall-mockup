<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f5">
  <title>Sunlight Simulator — WhiteWall Studios</title>
  <meta name="description" content="See how natural light moves through the WhiteWall Studios space by time of day and month of the year. Drag the sliders or press play to find the best light for your booking.">
  <meta property="og:title" content="Sunlight Simulator — WhiteWall Studios">
  <meta property="og:description" content="A live simulator showing what the sunlight looks like in the studio at any time, in any month.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="images/favicon-32.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #faf9f5; }
    /* Full-viewport frame; uses dynamic viewport height so mobile browser chrome does not clip it. */
    #sim-frame {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border: 0;
      display: block;
    }
    /* Drew, 2026-07-20: a small hint telling first-time visitors they can drag to interact.
       Lives on the wrapper (never inside Drew's bundle). Revised (DREW-6): yellow pill +
       black text, device-aware copy (finger vs cursor), and JS-pinned to the bottom-center
       of the actual studio image (the bundle's stage box) rather than the screen bottom.
       pointer-events:none so it can never intercept the very drag it is advertising.
       position/left/top are set by JS; hidden until the image is found + positioned. */
    #drag-hint {
      position: fixed;
      left: 0;
      top: 0;
      transform: translate(-50%, -100%);
      visibility: hidden;
      z-index: 10;
      pointer-events: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      width: max-content;
      max-width: min(92vw, 640px);
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      background: #ffd400;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
      color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: clamp(0.72rem, 2.4vw, 0.85rem);
      line-height: 1.25;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.01em;
    }
    #drag-hint svg { flex: 0 0 auto; width: 1.05em; height: 1.05em; }
  </style>
</head>
<body>
  <!--
    The simulator itself is a self-contained bundle Drew authored (sunlight-simulator-app.html),
    embedded here so this menu-bar page carries a proper title and site metadata while the
    bundle stays byte-for-byte as delivered. Change requests: Drew, 2026-07-18.
  -->
  <iframe id="sim-frame" src="/sunlight-simulator-app.html" title="WhiteWall Studios Natural Light Simulator" allowfullscreen loading="eager"></iframe>
  <div id="drag-hint" role="note">
    <!-- pointer with left-right motion arrows: "drag to interact" -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 11.5V5.5a1.5 1.5 0 0 1 3 0v5"/>
      <path d="M12 10.5a1.5 1.5 0 0 1 3 0v1"/>
      <path d="M15 11a1.5 1.5 0 0 1 3 0v3.5a4.5 4.5 0 0 1-4.5 4.5h-1.2a4.5 4.5 0 0 1-3.4-1.55l-2.2-2.6a1.5 1.5 0 0 1 2.1-2.1l1.3 1.15"/>
      <path d="M3.5 5.5 1.5 7.5l2 2"/>
      <path d="M20.5 5.5l2 2-2 2"/>
      <path d="M1.5 7.5h6"/>
      <path d="M16.5 7.5h6"/>
    </svg>
    <span id="drag-hint-label">Drag your cursor to interact with the simulator</span>
  </div>
  <script>
    /* DREW-6 (Drew, 2026-07-20): the drag hint is device-aware and pinned to the actual
       studio image, not the screen. The bundle is same-origin, so we read the image's box
       (the stage that wraps <img alt="Whitewall Studios interior">) and place the pill at
       its bottom-center, tracking it on load / resize / scroll. Drew's bundle is never
       modified — we only read its layout and draw over it. */
    (function () {
      var frame = document.getElementById('sim-frame');
      var hint = document.getElementById('drag-hint');
      var label = document.getElementById('drag-hint-label');
      var STAGE_SEL = 'img[alt="Whitewall Studios interior"]';

      // Device-aware copy: a touch / coarse-pointer device (iPhone, iPad, Android) drags with
      // a finger; everything else drags with a cursor. Keyed on capability, not UA string.
      var isTouch =
        (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
        ('ontouchstart' in window) ||
        (navigator.maxTouchPoints > 0);
      var text = 'Drag your ' + (isTouch ? 'finger' : 'cursor') + ' to interact with the simulator';
      label.textContent = text;
      hint.setAttribute('aria-label', text);

      function stageEl() {
        try {
          var doc = frame.contentDocument;
          if (!doc) return null;
          var img = doc.querySelector(STAGE_SEL);
          return img ? img.parentElement : null;
        } catch (e) {
          return null; // cross-origin guard (should not happen — same origin)
        }
      }

      // Drew, 2026-07-20 (DREW-7): remove the "SUN PATH" mini-chart in the top-right of the
      // image. It is a self-contained card inside Drew's bundle; we find it in the live DOM by
      // its "SUN PATH" label and hide the card. Cache it so we only scan once, then re-assert
      // display:none each tick in case the bundle ever redraws. Bundle file stays untouched.
      var pathCard = null;
      function hidePath() {
        try {
          if (pathCard) {
            if (pathCard.style.display !== 'none') pathCard.style.display = 'none';
            return;
          }
          var doc = frame.contentDocument;
          if (!doc) return;
          var divs = doc.querySelectorAll('div');
          for (var i = 0; i < divs.length; i++) {
            var d = divs[i];
            if (d.children.length === 0 && d.textContent.trim() === 'SUN PATH') {
              pathCard = d.parentElement; // the blurred card holding the label + sun-path canvas
              if (pathCard) pathCard.style.display = 'none';
              return;
            }
          }
        } catch (e) {}
      }

      function place() {
        var stage = stageEl();
        if (!stage) { hint.style.visibility = 'hidden'; return; }
        var r = stage.getBoundingClientRect();
        // The iframe is fixed at inset:0 filling the viewport 1:1, so the stage's rect (in the
        // iframe's viewport) equals the top-window viewport coords the fixed pill uses.
        if (r.width < 1 || r.height < 1 || r.bottom < 0 || r.top > window.innerHeight) {
          hint.style.visibility = 'hidden';
          return;
        }
        hint.style.left = (r.left + r.width / 2) + 'px';
        hint.style.top = (r.bottom - 14) + 'px'; // pill bottom sits just inside the image bottom
        hint.style.visibility = 'visible';
      }

      function bindInner() {
        try {
          var win = frame.contentWindow;
          if (!win) return;
          win.addEventListener('scroll', place, { passive: true });
          win.addEventListener('resize', place, { passive: true });
          if (win.document) {
            win.document.addEventListener('scroll', place, { passive: true });
          }
        } catch (e) {}
      }

      // The bundle unpacks asynchronously; poll until the image exists, then bind + place.
      var tries = 0;
      var poll = setInterval(function () {
        tries++;
        hidePath();
        if (stageEl()) { clearInterval(poll); bindInner(); place(); }
        else if (tries > 200) { clearInterval(poll); } // ~40s ceiling, then give up quietly
      }, 200);

      frame.addEventListener('load', function () { bindInner(); place(); hidePath(); });
      window.addEventListener('resize', place, { passive: true });
      window.addEventListener('scroll', place, { passive: true });
      setInterval(function () { place(); hidePath(); }, 400); // reflow tracking + keep the sun-path chart hidden
    })();
  </script>
  <!-- WWA-3: capture gclid/wbraid/gbraid + utm on every page (runs first, before nav) -->
  <script src="/scripts/attribution.js"></script>
  <script src="/scripts/site-nav.js"></script>
</body>
</html>
