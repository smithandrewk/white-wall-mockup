  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your account - WhiteWall Studios</title>
  <link rel="icon" type="image/png" href="images/favicon-32.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/booking.css">
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { "wws-black": "#000000", "wws-dark": "#383838", "wws-light": "#F4F4F2", "wws-gray": "#E0E0E0", "wws-accent": "#FCD518" },
        fontFamily: { display: ['"Cormorant Garamond"', "serif"], body: ["Inter", "sans-serif"] }
      } }
    }
  </script>
  <script src="/scripts/staging-banner.js"></script>

<body class="booking-page min-h-screen">
  <nav class="border-b border-black/10">
    <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between gap-6">
      <a href="/" class="flex items-center gap-3">
        <img src="images/logo/wws-logo-white.png" alt="WhiteWall Studios" class="h-10" style="filter:brightness(0)">
      </a>
      <div class="flex items-center gap-8 text-xs tracking-[0.2em] uppercase text-black/50">
        <a href="/" class="hover:text-black transition hidden md:inline">Home</a>
        <a href="/book-powdersville" class="hover:text-black transition">Book</a>
        <button type="button" data-signout class="hover:text-black transition uppercase tracking-[0.2em]">Sign out</button>
      </div>
    </div>
  </nav>

  <main class="px-6 py-12">
    <div class="max-w-3xl mx-auto">
      <div data-loading class="text-center text-black/50 py-20">Loading your account…</div>

      <div data-content class="hidden">
        <h1 class="font-display text-4xl md:text-5xl leading-none">Your account</h1>

        <!-- Account Info (editable) -->
        <section class="booking-panel p-6 md:p-8 mt-8">
          <p class="text-xs tracking-[0.2em] uppercase text-black/45 mb-5">Account Info</p>
          <form data-profile-form="account" class="space-y-4">
            <div>
              <label class="block text-xs uppercase tracking-[0.15em] text-black/45 mb-1">Full name</label>
              <input type="text" data-field="fullName" class="booking-input" placeholder="Your full name">
            </div>
            <div>
              <label class="block text-xs uppercase tracking-[0.15em] text-black/45 mb-1">Company name</label>
              <input type="text" data-field="companyName" class="booking-input" placeholder="Company name">
            </div>
            <div>
              <label class="block text-xs uppercase tracking-[0.15em] text-black/45 mb-1">Company website <span class="normal-case tracking-normal text-black/35">(optional)</span></label>
              <input type="url" data-field="companyWebsite" class="booking-input" placeholder="https://example.com">
            </div>
            <div class="flex items-center gap-3 pt-1">
              <button type="submit" class="text-xs uppercase tracking-[0.18em] bg-black text-white rounded px-4 py-2 disabled:opacity-40">Save account info</button>
              <span data-msg class="text-sm"></span>
            </div>
          </form>
        </section>

        <!-- Contact Info (editable, all required) -->
        <section class="booking-panel p-6 md:p-8 mt-6">
          <p class="text-xs tracking-[0.2em] uppercase text-black/45 mb-5">Contact Info</p>
          <form data-profile-form="contact" class="space-y-4">
            <div>
              <label class="block text-xs uppercase tracking-[0.15em] text-black/45 mb-1">Email <span class="normal-case tracking-normal text-black/35">(your login — cannot be changed here)</span></label>
              <input type="email" data-field="email" class="booking-input bg-black/5" readonly>
            </div>
            <div>
              <label class="block text-xs uppercase tracking-[0.15em] text-black/45 mb-1">Phone</label>
              <input type="tel" data-field="phone" class="booking-input" placeholder="(555) 555-5555" required>
            </div>
            <div>
              <label class="block text-xs uppercase tracking-[0.15em] text-black/45 mb-1">Instagram</label>
              <input type="text" data-field="instagram" class="booking-input" placeholder="@yourstudio" required>
            </div>
            <div class="flex items-center gap-3 pt-1">
              <button type="submit" class="text-xs uppercase tracking-[0.18em] bg-black text-white rounded px-4 py-2 disabled:opacity-40">Save contact info</button>
              <span data-msg class="text-sm"></span>
            </div>
          </form>
        </section>

        <!-- Card On File -->
        <section class="booking-panel p-6 md:p-8 mt-6">
          <p class="text-xs tracking-[0.2em] uppercase text-black/45 mb-4">Card On File</p>
          <div class="flex items-center justify-between gap-4 flex-wrap">
            <p data-card class="text-sm text-black/70">No card on file yet.</p>
            <button type="button" data-card-add class="text-xs uppercase tracking-[0.18em] border border-black/30 rounded px-3 py-1.5 hover:bg-black hover:text-white transition">Add / update card</button>
          </div>

          <!-- Card entry (hidden until "Add / update card") -->
          <form data-card-form class="hidden mt-5 space-y-4">
            <div>
              <label class="block text-xs uppercase tracking-[0.15em] text-black/45 mb-1">Name on card <span class="normal-case tracking-normal text-black/35">(optional)</span></label>
              <input type="text" data-card-name class="booking-input" placeholder="Name as it appears on the card" autocomplete="cc-name">
            </div>
            <div>
              <label class="block text-xs uppercase tracking-[0.15em] text-black/45 mb-1">Card details</label>
              <div id="account-card-container" class="square-card-container"></div>
            </div>
            <p data-card-status class="text-sm text-black/55" style="display:none"></p>
            <div class="flex items-center gap-3 pt-1">
              <button type="submit" data-card-save class="text-xs uppercase tracking-[0.18em] bg-black text-white rounded px-4 py-2 disabled:opacity-40">Save card</button>
              <button type="button" data-card-cancel class="text-xs uppercase tracking-[0.18em] text-black/45 hover:text-black">Cancel</button>
              <span data-card-msg class="text-sm"></span>
            </div>
          </form>
        </section>

        <!-- Your Upcoming Sessions -->
        <section class="booking-panel p-6 md:p-8 mt-6">
          <p class="text-xs tracking-[0.2em] uppercase text-black/45 mb-4">Your Upcoming Sessions</p>
          <div data-upcoming class="space-y-4"></div>
          <p data-no-upcoming class="text-sm text-black/55 hidden">No upcoming sessions. <a href="/book-powdersville" class="underline hover:text-black">Book a session</a>.</p>
        </section>

        <!-- Completed Sessions -->
        <section class="booking-panel p-6 md:p-8 mt-6">
          <p class="text-xs tracking-[0.2em] uppercase text-black/45 mb-4">Completed Sessions</p>
          <div data-completed class="space-y-4"></div>
          <p data-no-completed class="text-sm text-black/55 hidden">No completed sessions yet.</p>
        </section>
      </div>
    </div>
  </main>

  <script src="/scripts/account.js"></script>
  <script>
    (function () {
      var loading = document.querySelector("[data-loading]");
      var content = document.querySelector("[data-content]");

      function fmtMoney(cents) { return "$" + (Number(cents || 0) / 100).toFixed(2); }
      function fmtDateTime(iso) {
        try {
          return new Date(iso).toLocaleString("en-US", {
            timeZone: "America/New_York",
            weekday: "short", month: "short", day: "numeric", year: "numeric",
            hour: "numeric", minute: "2-digit"
          });
        } catch (e) { return iso; }
      }
      function fmtTime(iso) {
        try {
          return new Date(iso).toLocaleTimeString("en-US", {
            timeZone: "America/New_York", hour: "numeric", minute: "2-digit"
          });
        } catch (e) { return iso; }
      }
      function locLabel(s) { return s === "powdersville" ? "Flagship (Powdersville)" : (s === "taylors-mill" ? "Taylor's Mill" : s); }
      function set(sel, val) { var el = document.querySelector(sel); if (el) el.textContent = val || "—"; }
      function clampQty(v, max) { var n = parseInt(v, 10); if (!Number.isInteger(n) || n < 1) n = 1; if (n > max) n = max; return n; }

      // Display labels for saved add-ons (keyed by the server's ADDON_PRICES id,
      // api/_lib/acuity.js) — used to render the read-only Completed Sessions
      // history. Falls back to the raw id for any future add-on not listed.
      var ADDON_LABELS = {
        "lighting-powdersville": "Lighting Rental",
        "lighting-taylors-mill": "Lighting Rental",
        "backdrops-all": "All Backdrops",
        "backdrops-single": "Single Backdrop",
        "walls-all": "All Rolling Walls",
        "walls-single": "Single Rolling Wall",
        "chairs-25": "25 Chairs",
        "chairs-50": "50 Chairs",
        "chairs-75": "75 Chairs",
        "chairs-100": "100 Chairs",
        "table": "8ft Folding Table",
        "tv": "86in Rolling TV",
        "pa-system": "PA System",
        "setup-crew": "Event Setup and Reset Crew",
        "cleaning-fee": "Cleaning Fee"
      };
      function addonLabel(a) { return ADDON_LABELS[a.addon_id] || String(a.addon_id || "Add-on"); }
      function addonLineCents(a) {
        return (Number(a.unit_cents) || 0) * (Number(a.quantity) || 1) - (Number(a.discount_cents) || 0);
      }

      // Addable add-ons per location, keyed by the server's ADDON_PRICES id
      // (api/_lib/acuity.js). Prices here are display hints only — the server
      // recomputes from its own tables and is the sole source of truth. Add-only:
      // ones already on a session are filtered out before rendering. Variant
      // pickers (single backdrops/walls) and the placement-driven Setup Crew are
      // intentionally omitted from the profile editor.
      var ADDON_CATALOG = {
        "powdersville": [
          { id: "lighting-powdersville", label: "Lighting rental", cents: 12500 },
          { id: "backdrops-all", label: "All backdrops", cents: 5000 },
          { id: "walls-all", label: "All rolling walls", cents: 7000 },
          { id: "chairs-25", label: "25 chairs", cents: 10000 },
          { id: "chairs-50", label: "50 chairs", cents: 19000 },
          { id: "chairs-75", label: "75 chairs", cents: 28000 },
          { id: "chairs-100", label: "100 chairs", cents: 37000 },
          { id: "table", label: "8ft folding table", cents: 1500, quantity: true, max: 10 },
          { id: "tv", label: "86in rolling TV", cents: 5000 },
          { id: "pa-system", label: "PA system", cents: 4000 }
        ],
        "taylors-mill": [
          { id: "lighting-taylors-mill", label: "Lighting rental", cents: 5000 },
          { id: "backdrops-all", label: "All backdrops", cents: 5000 }
        ]
      };

      document.querySelector("[data-signout]").addEventListener("click", async function () {
        try { await window.WWSAccount.signOut(); } catch (e) {}
        location.href = "/login";
      });

      (async function () {
        var profile;
        try {
          profile = await window.WWSAccount.fetchProfile();
        } catch (e) { profile = null; }

        if (!profile) {
          location.href = "/login?next=/account";
          return;
        }

        var c = profile.customer || {};

        // --- Account Info + Contact Info forms ---
        function field(sel) { return document.querySelector(sel); }
        function setVal(name, val) {
          var el = document.querySelector("[data-field='" + name + "']");
          if (el) el.value = val == null ? "" : val;
        }
        setVal("fullName", c.fullName);
        setVal("companyName", c.companyName);
        setVal("companyWebsite", c.companyWebsite);
        setVal("email", c.email);
        setVal("phone", c.phone);
        setVal("instagram", c.instagram);

        if (c.cardOnFile && c.cardOnFile.last4) {
          setCardDisplay(c.cardOnFile);
        }

        wireProfileForms();
        wireCardOnFile();

        // --- Sessions ---
        var upcoming = profile.upcomingSessions || [];
        var completed = profile.completedSessions || [];

        var upWrap = document.querySelector("[data-upcoming]");
        if (!upcoming.length) {
          document.querySelector("[data-no-upcoming]").classList.remove("hidden");
        } else {
          upcoming.forEach(function (b) { upWrap.appendChild(renderUpcomingCard(b)); });
        }

        var compWrap = document.querySelector("[data-completed]");
        if (!completed.length) {
          document.querySelector("[data-no-completed]").classList.remove("hidden");
        } else {
          completed.forEach(function (b) { compWrap.appendChild(renderCompletedCard(b)); });
        }

        loading.classList.add("hidden");
        content.classList.remove("hidden");
      })();

      // The profile editor (Drew round 4, item 6). Both Save buttons POST the
      // FULL field set to /api/account/profile-update (the server requires phone
      // and saves all fields at once), so saving from either section never nulls
      // out the other. Email is read-only (the auth identity) and is never sent.
      function wireProfileForms() {
        var forms = document.querySelectorAll("[data-profile-form]");
        Array.prototype.forEach.call(forms, function (form) {
          form.addEventListener("submit", function (e) {
            e.preventDefault();
            saveProfile(form);
          });
        });
      }

      function readField(name) {
        var el = document.querySelector("[data-field='" + name + "']");
        return el ? el.value.trim() : "";
      }

      // --- Card On File (Drew V3 item 1) ---------------------------------
      // The customer enters a NEW card and saves it as their card on file.
      // Mirrors the booking page's Square Web Payments SDK init/tokenize, but
      // with intent:"STORE" — SAVING A CARD IS NOT A CHARGE. The single-use
      // token is POSTed to /api/account/save-card via WWSAccount.saveCard.
      var sqState = { sdkPromise: null, card: null, mounting: false, ready: false };

      function setCardDisplay(cof) {
        var el = document.querySelector("[data-card]");
        if (!el) return;
        if (cof && cof.last4) {
          el.textContent = (cof.brand ? cof.brand + " " : "") + "ending in " + cof.last4;
        } else {
          el.textContent = "No card on file yet.";
        }
      }

      function setCardStatus(msg, isError) {
        var el = document.querySelector("[data-card-status]");
        if (!el) return;
        el.textContent = msg || "";
        el.style.display = msg ? "" : "none";
        el.className = "text-sm " + (isError ? "text-red-600" : "text-black/55");
      }

      // Fetch the PUBLIC Square config + inject the SDK script. Resolves with the
      // config (same endpoint + env-switched SDK URL the booking page uses).
      function loadSquareSdk() {
        if (sqState.sdkPromise) return sqState.sdkPromise;
        sqState.sdkPromise = fetch("/api/booking-public-config")
          .then(function (r) { if (!r.ok) throw new Error("config " + r.status); return r.json(); })
          .then(function (cfg) {
            if (window.Square) return cfg;
            return new Promise(function (resolve, reject) {
              var s = document.createElement("script");
              s.src = cfg.squareSdkUrl;
              s.onload = function () { resolve(cfg); };
              s.onerror = function () { reject(new Error("Square SDK failed to load")); };
              document.head.appendChild(s);
            });
          });
        return sqState.sdkPromise;
      }

      // Mount the card field once (idempotent). The container must be visible
      // (the form is un-hidden before this is called) or Square's attach() fails.
      function mountCard() {
        if (sqState.card || sqState.mounting) return;
        var target = document.querySelector("#account-card-container");
        if (!target) return;
        sqState.mounting = true;
        setCardStatus("Loading secure card field…");
        loadSquareSdk()
          .then(function (cfg) {
            var payments = window.Square.payments(cfg.squareAppId, cfg.squareLocationId);
            return payments.card().then(function (card) {
              return card.attach("#account-card-container").then(function () {
                sqState.card = card;
                sqState.ready = true;
                sqState.mounting = false;
                setCardStatus("");
              });
            });
          })
          .catch(function (err) {
            sqState.mounting = false;
            sqState.ready = false;
            console.error("Square card init failed:", err);
            setCardStatus("Card field couldn't load. Refresh and try again.", true);
          });
      }

      function wireCardOnFile() {
        var addBtn = document.querySelector("[data-card-add]");
        var form = document.querySelector("[data-card-form]");
        var cancelBtn = document.querySelector("[data-card-cancel]");
        if (!addBtn || !form) return;

        addBtn.addEventListener("click", function () {
          form.classList.remove("hidden");
          addBtn.classList.add("hidden");
          // Mount after the form is visible so Square can attach to a laid-out node.
          mountCard();
        });

        if (cancelBtn) {
          cancelBtn.addEventListener("click", function () {
            form.classList.add("hidden");
            addBtn.classList.remove("hidden");
            setCardStatus("");
            var msg = document.querySelector("[data-card-msg]");
            if (msg) msg.textContent = "";
          });
        }

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          submitCard();
        });
      }

      async function submitCard() {
        var saveBtn = document.querySelector("[data-card-save]");
        var msg = document.querySelector("[data-card-msg]");
        var nameEl = document.querySelector("[data-card-name]");
        function setMsg(text, kind) {
          if (!msg) return;
          msg.textContent = text || "";
          msg.className = "text-sm " + (kind === "error" ? "text-red-600" : kind === "ok" ? "text-green-700" : "text-black/55");
        }

        if (!sqState.ready || !sqState.card) {
          setMsg("Card field isn't ready yet. One moment…", "error");
          return;
        }

        if (saveBtn) saveBtn.disabled = true;
        setMsg("Saving your card…", "info");

        var cardholderName = nameEl ? nameEl.value.trim() : "";

        try {
          // intent:"STORE" tokenizes the card for saving — NO charge. Any
          // SCA/3DS challenge the issuer requires happens inside tokenize().
          var tok;
          try {
            tok = await sqState.card.tokenize({
              intent: "STORE",
              customerInitiated: true,
              sellerKeyedIn: false,
              billingContact: {
                givenName: cardholderName,
                familyName: "",
                countryCode: "US"
              }
            });
          } catch (tokErr) {
            setMsg("We couldn't read your card. Please re-enter it and try again.", "error");
            if (saveBtn) saveBtn.disabled = false;
            return;
          }
          if (!tok || tok.status !== "OK" || !tok.token) {
            var detail = tok && tok.errors && tok.errors[0] && tok.errors[0].detail;
            setMsg(detail || "Your card could not be verified. Please check the details.", "error");
            if (saveBtn) saveBtn.disabled = false;
            return;
          }

          var r = await window.WWSAccount.saveCard({ squareToken: tok.token, cardholderName: cardholderName });
          if (r.ok && r.data && r.data.card) {
            setCardDisplay(r.data.card);
            setMsg("Card saved.", "ok");
            // Collapse the form back; re-show the "Add / update card" button.
            setTimeout(function () {
              var form = document.querySelector("[data-card-form]");
              var addBtn = document.querySelector("[data-card-add]");
              if (form) form.classList.add("hidden");
              if (addBtn) addBtn.classList.remove("hidden");
              setMsg("");
            }, 1400);
          } else if (r.status === 402) {
            setMsg((r.data && r.data.error) || "We couldn't save that card. Please check the details.", "error");
            if (saveBtn) saveBtn.disabled = false;
          } else {
            var dmsg = r.data && (r.data.details && r.data.details.join(", ") || r.data.error);
            setMsg(dmsg || "Could not save your card.", "error");
            if (saveBtn) saveBtn.disabled = false;
          }
        } catch (e) {
          setMsg("Could not save your card. Please try again.", "error");
          if (saveBtn) saveBtn.disabled = false;
        }
      }

      async function saveProfile(form) {
        var msg = form.querySelector("[data-msg]");
        var btn = form.querySelector("button[type='submit']");
        function setMsg(text, kind) {
          if (!msg) return;
          msg.textContent = text || "";
          msg.className = "text-sm " + (kind === "error" ? "text-red-600" : kind === "ok" ? "text-green-700" : "text-black/55");
        }

        var phone = readField("phone");
        var instagram = readField("instagram");
        // Contact Info is mandatory (Drew round 4).
        if (!phone || phone.replace(/\D/g, "").length < 10) {
          setMsg("Enter a valid phone number in Contact Info.", "error");
          return;
        }
        if (!instagram) {
          setMsg("Instagram is required in Contact Info.", "error");
          return;
        }

        var payload = {
          fullName: readField("fullName"),
          companyName: readField("companyName"),
          companyWebsite: readField("companyWebsite"),
          phone: phone,
          instagram: instagram
        };

        if (btn) btn.disabled = true;
        setMsg("Saving…", "info");
        try {
          var r = await window.WWSAccount.updateProfile(payload);
          if (r.ok) {
            setMsg("Saved.", "ok");
          } else {
            var detail = r.data && (r.data.details && r.data.details.join(", ") || r.data.error);
            setMsg(detail || "Could not save your profile.", "error");
          }
        } catch (e) {
          setMsg("Could not save your profile.", "error");
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      // Sort a booking's sessions chronologically.
      function sortedSessions(b) {
        return (b.booking_sessions || []).slice().sort(function (x, y) {
          return new Date(x.starts_at) - new Date(y.starts_at);
        });
      }

      // An upcoming booking: header + per-session rows (each with the inline
      // item-7 editor) + balance / pay-remaining affordance.
      function renderUpcomingCard(b) {
        var sessions = sortedSessions(b);
        var card = document.createElement("div");
        card.className = "border border-black/10 rounded-lg p-4";

        var header = document.createElement("div");
        header.className = "flex items-center justify-between mb-2";
        header.innerHTML =
          '<span class="text-xs tracking-[0.18em] uppercase text-black/45">' + (b.event_intent === "yes" ? "Event" : "Session") + ' · ' + b.status + '</span>' +
          '<span class="text-sm font-medium">' + fmtMoney(b.total_cents) + '</span>';
        card.appendChild(header);

        if (!sessions.length) {
          var pending = document.createElement("p");
          pending.className = "text-sm text-black/55";
          pending.textContent = "Details pending.";
          card.appendChild(pending);
        } else {
          sessions.forEach(function (s) { card.appendChild(renderSessionRow(s, b)); });
        }

        if (b.balance_status && b.balance_status !== "none") {
          var bl = document.createElement("p");
          bl.className = "text-xs text-black/50 mt-2";
          bl.textContent = "Balance " + fmtMoney(b.balance_due_cents) + " · " + b.balance_status;
          card.appendChild(bl);

          // "Pay remaining balance" — only when a balance is actually OWED
          // (scheduled or locked-out 'failed'), there's a positive amount,
          // and it's a deposit booking. Server re-authorizes + reprices.
          var owed = b.payment_mode === "deposit" &&
            (b.balance_status === "scheduled" || b.balance_status === "failed") &&
            Number(b.balance_due_cents) > 0;
          if (owed) {
            card.appendChild(renderPayBalance(b));
          }
        }
        return card;
      }

      // A completed booking (Drew round 4, item 6): read-only history showing each
      // past session's date, what was booked, the spend, and the add-ons tied to it.
      function renderCompletedCard(b) {
        var sessions = sortedSessions(b);
        var card = document.createElement("div");
        card.className = "border border-black/10 rounded-lg p-4";

        var header = document.createElement("div");
        header.className = "flex items-center justify-between mb-3";
        header.innerHTML =
          '<span class="text-xs tracking-[0.18em] uppercase text-black/45">' + (b.event_intent === "yes" ? "Event" : "Session") + ' · ' + b.status + '</span>' +
          '<span class="text-sm font-medium">' + fmtMoney(b.total_cents) + '</span>';
        card.appendChild(header);

        if (!sessions.length) {
          var none = document.createElement("p");
          none.className = "text-sm text-black/55";
          none.textContent = "No session details on record.";
          card.appendChild(none);
          return card;
        }

        sessions.forEach(function (s) {
          var block = document.createElement("div");
          block.className = "py-2 border-t border-black/5 first:border-t-0";

          var line = document.createElement("div");
          line.className = "flex items-center justify-between text-sm";
          var left = document.createElement("span");
          left.className = "text-black/70";
          left.textContent = fmtDateTime(s.starts_at) + " · " + locLabel(s.location) + " · " + Math.round(s.duration_min / 60) + "h";
          var right = document.createElement("span");
          right.className = "text-black/55";
          right.textContent = fmtMoney(s.session_price_cents);
          line.appendChild(left);
          line.appendChild(right);
          block.appendChild(line);

          var addons = s.booking_session_addons || [];
          if (addons.length) {
            var list = document.createElement("ul");
            list.className = "mt-1 ml-3 space-y-0.5";
            addons.forEach(function (a) {
              var li = document.createElement("li");
              li.className = "flex items-center justify-between text-xs text-black/50";
              var nm = document.createElement("span");
              nm.textContent = addonLabel(a) + ((Number(a.quantity) || 1) > 1 ? " ×" + a.quantity : "");
              var amt = document.createElement("span");
              amt.textContent = fmtMoney(addonLineCents(a));
              li.appendChild(nm);
              li.appendChild(amt);
              list.appendChild(li);
            });
            block.appendChild(list);
          }
          card.appendChild(block);
        });
        return card;
      }

      // "Pay remaining balance" affordance (V3 item 6 — the lockout pay path).
      // Charges the card on file via /api/pay-balance. When the feature is dark
      // (PAY_BALANCE_ENABLED off) the server returns 503 and we say so plainly.
      function renderPayBalance(booking) {
        var box = document.createElement("div");
        box.className = "mt-2";

        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "text-xs tracking-[0.18em] uppercase border border-black/30 rounded px-3 py-1.5 hover:bg-black hover:text-white transition";
        btn.textContent = "Pay remaining balance (" + fmtMoney(booking.balance_due_cents) + ")";

        var msg = document.createElement("span");
        msg.className = "text-xs text-black/55 ml-3";

        btn.addEventListener("click", async function () {
          btn.disabled = true;
          msg.textContent = "Charging your card on file…";
          msg.className = "text-xs text-black/55 ml-3";
          try {
            var r = await window.WWSAccount.payBalance(booking.id);
            if (r.ok) {
              msg.textContent = "Paid. Thank you!";
              msg.className = "text-xs text-green-700 ml-3";
              setTimeout(function () { location.reload(); }, 1200);
              return;
            }
            if (r.status === 503) {
              msg.textContent = (r.data && r.data.error) || "Paying online is not enabled yet.";
            } else if (r.status === 402) {
              msg.textContent = (r.data && r.data.error) || "Your card was declined.";
            } else {
              msg.textContent = (r.data && r.data.error) || "Could not pay the balance.";
            }
            msg.className = "text-xs text-red-700 ml-3";
            btn.disabled = false;
          } catch (e) {
            msg.textContent = "Could not pay the balance.";
            msg.className = "text-xs text-red-700 ml-3";
            btn.disabled = false;
          }
        });

        box.appendChild(btn);
        box.appendChild(msg);
        return box;
      }

      // One session line + an inline "Edit" affordance that toggles the editor.
      function renderSessionRow(session, booking) {
        var row = document.createElement("div");
        row.className = "py-1";

        var line = document.createElement("div");
        line.className = "flex items-center justify-between text-sm";
        var left = document.createElement("span");
        left.className = "text-black/70";
        left.textContent = fmtDateTime(session.starts_at) + " · " + locLabel(session.location) + " · " + Math.round(session.duration_min / 60) + "h";
        var right = document.createElement("span");
        right.className = "flex items-center gap-3 text-black/55";
        var price = document.createElement("span");
        price.textContent = fmtMoney(session.session_price_cents);
        right.appendChild(price);
        line.appendChild(left);
        line.appendChild(right);
        row.appendChild(line);

        // Only editable sessions get an Edit button (need a known type to price/reschedule).
        if (session.appointment_type_id) {
          var host = document.createElement("div");
          var editBtn = document.createElement("button");
          editBtn.type = "button";
          editBtn.className = "text-xs uppercase tracking-[0.15em] underline text-black/50 hover:text-black";
          editBtn.textContent = "Edit";
          right.appendChild(editBtn);
          row.appendChild(host);
          editBtn.addEventListener("click", function () {
            if (host.firstChild) { host.innerHTML = ""; editBtn.textContent = "Edit"; return; }
            editBtn.textContent = "Close";
            host.appendChild(buildEditor(session, booking, function () {
              host.innerHTML = ""; editBtn.textContent = "Edit";
            }));
          });
        }
        return row;
      }

      // The inline editor: reschedule (date -> availability slots) + add add-ons,
      // with a live price-delta preview. Confirm POSTs to /api/account/booking-edit
      // with the Supabase bearer token. The money-gate 409 ("not enabled yet") is
      // handled gracefully: the customer is offered a free reschedule-only retry.
      function buildEditor(session, booking, onClose) {
        var typeId = String(session.appointment_type_id);
        var savedIds = {};
        (session.booking_session_addons || []).forEach(function (a) { savedIds[String(a.addon_id)] = true; });
        var catalog = (ADDON_CATALOG[session.location] || []).filter(function (a) {
          return !savedIds[a.id]; // add-only: hide what's already on the session
        });

        var state = { datetime: null, addons: {} }; // addons: id -> quantity
        var includeAddonsOnSubmit = true;

        var box = document.createElement("div");
        box.className = "mt-3 border-t border-black/10 pt-3 space-y-4";

        // --- Reschedule ---
        var resWrap = document.createElement("div");
        resWrap.innerHTML = '<p class="text-xs tracking-[0.18em] uppercase text-black/45 mb-2">Change date &amp; time</p>';
        var dateRow = document.createElement("div");
        dateRow.className = "flex items-center gap-2";
        var dateInput = document.createElement("input");
        dateInput.type = "date";
        dateInput.min = new Date().toISOString().slice(0, 10);
        dateInput.className = "border border-black/15 rounded px-2 py-1 text-sm";
        var findBtn = document.createElement("button");
        findBtn.type = "button";
        findBtn.className = "text-xs uppercase tracking-[0.15em] border border-black/20 rounded px-3 py-1 hover:bg-black hover:text-white transition";
        findBtn.textContent = "Find times";
        dateRow.appendChild(dateInput);
        dateRow.appendChild(findBtn);
        resWrap.appendChild(dateRow);
        var timesWrap = document.createElement("div");
        timesWrap.className = "flex flex-wrap gap-2 mt-2";
        resWrap.appendChild(timesWrap);
        box.appendChild(resWrap);

        findBtn.addEventListener("click", async function () {
          if (!dateInput.value) return;
          state.datetime = null;
          timesWrap.innerHTML = '<span class="text-xs text-black/45">Loading…</span>';
          try {
            var times = await window.WWSAccount.fetchAvailabilityTimes(typeId, dateInput.value);
            timesWrap.innerHTML = "";
            if (!times.length) {
              timesWrap.innerHTML = '<span class="text-xs text-black/45">No open times that day.</span>';
              updateDelta();
              return;
            }
            times.forEach(function (t) {
              var slot = document.createElement("button");
              slot.type = "button";
              slot.className = "text-xs border border-black/20 rounded px-2 py-1 hover:bg-black hover:text-white transition";
              slot.textContent = fmtTime(t.time);
              slot.addEventListener("click", function () {
                state.datetime = t.time;
                Array.prototype.forEach.call(timesWrap.children, function (c) { c.classList.remove("bg-black", "text-white"); });
                slot.classList.add("bg-black", "text-white");
                updateDelta();
              });
              timesWrap.appendChild(slot);
            });
          } catch (e) {
            timesWrap.innerHTML = '<span class="text-xs text-red-600">Could not load times.</span>';
          }
        });

        // --- Add add-ons (add-only) ---
        if (catalog.length) {
          var addWrap = document.createElement("div");
          addWrap.innerHTML = '<p class="text-xs tracking-[0.18em] uppercase text-black/45 mb-2">Add add-ons</p>';
          catalog.forEach(function (a) {
            var lbl = document.createElement("label");
            lbl.className = "flex items-center justify-between text-sm py-1 cursor-pointer";
            var lft = document.createElement("span");
            lft.className = "flex items-center gap-2 text-black/70";
            var cb = document.createElement("input");
            cb.type = "checkbox";
            var nm = document.createElement("span");
            nm.textContent = a.label;
            lft.appendChild(cb);
            lft.appendChild(nm);
            var qtyInput = null;
            if (a.quantity) {
              qtyInput = document.createElement("input");
              qtyInput.type = "number";
              qtyInput.min = "1";
              qtyInput.max = String(a.max || 10);
              qtyInput.value = "1";
              qtyInput.className = "w-14 border border-black/15 rounded px-1 py-0.5 text-sm ml-2 hidden";
              qtyInput.addEventListener("input", function () {
                if (cb.checked) { state.addons[a.id] = clampQty(qtyInput.value, a.max || 10); updateDelta(); }
              });
              lft.appendChild(qtyInput);
            }
            var rgt = document.createElement("span");
            rgt.className = "text-black/55";
            rgt.textContent = "+" + fmtMoney(a.cents);
            lbl.appendChild(lft);
            lbl.appendChild(rgt);
            cb.addEventListener("change", function () {
              if (cb.checked) {
                state.addons[a.id] = a.quantity ? clampQty(qtyInput.value, a.max || 10) : 1;
                if (qtyInput) qtyInput.classList.remove("hidden");
              } else {
                delete state.addons[a.id];
                if (qtyInput) qtyInput.classList.add("hidden");
              }
              updateDelta();
            });
            addWrap.appendChild(lbl);
          });
          box.appendChild(addWrap);
        }

        // --- Delta preview + actions ---
        var deltaP = document.createElement("p");
        deltaP.className = "text-sm font-medium text-black/80";
        box.appendChild(deltaP);

        var msg = document.createElement("div");
        msg.className = "text-sm";
        box.appendChild(msg);

        var actions = document.createElement("div");
        actions.className = "flex items-center gap-3";
        var confirmBtn = document.createElement("button");
        confirmBtn.type = "button";
        confirmBtn.className = "text-xs uppercase tracking-[0.18em] bg-black text-white rounded px-4 py-2 disabled:opacity-40";
        confirmBtn.textContent = "Confirm changes";
        var cancelBtn = document.createElement("button");
        cancelBtn.type = "button";
        cancelBtn.className = "text-xs uppercase tracking-[0.18em] text-black/50 hover:text-black";
        cancelBtn.textContent = "Cancel";
        actions.appendChild(confirmBtn);
        actions.appendChild(cancelBtn);
        box.appendChild(actions);
        cancelBtn.addEventListener("click", function () { if (onClose) onClose(); });

        function selectedAddonsArray() {
          return Object.keys(state.addons).map(function (id) { return { addonId: id, quantity: state.addons[id] }; });
        }
        function computeDeltaCents() {
          var sum = 0;
          Object.keys(state.addons).forEach(function (id) {
            var entry = catalog.find(function (c) { return c.id === id; });
            if (entry) sum += entry.cents * state.addons[id];
          });
          return sum;
        }
        function hasChange() { return !!state.datetime || Object.keys(state.addons).length > 0; }
        function updateDelta() {
          var d = computeDeltaCents();
          var parts = [];
          if (state.datetime) parts.push("New time: " + fmtDateTime(state.datetime));
          if (d > 0) parts.push("Adds " + fmtMoney(d) + " to your card on file");
          deltaP.textContent = parts.length ? parts.join(" · ") : "No changes selected yet.";
          confirmBtn.disabled = !hasChange();
        }
        function setMsg(text, kind) {
          msg.textContent = text || "";
          msg.className = "text-sm " + (kind === "error" ? "text-red-600" : kind === "ok" ? "text-green-700" : "text-black/60");
        }

        async function submit(includeAddons) {
          confirmBtn.disabled = true;
          setMsg("Saving…", "info");
          var payload = { bookingId: booking.id, sessionId: session.id };
          if (state.datetime) payload.newDatetime = state.datetime;
          if (includeAddons) {
            var arr = selectedAddonsArray();
            if (arr.length) payload.addAddons = arr;
          }
          try {
            var r = await window.WWSAccount.submitBookingEdit(payload);
            if (r.ok) {
              setMsg("Updated. Refreshing…", "ok");
              setTimeout(function () { location.reload(); }, 1200);
              return;
            }
            // Money gate OFF: paid add-ons can't be added yet. Offer a free reschedule.
            if (r.status === 409 && /not enabled/i.test((r.data && r.data.error) || "")) {
              if (state.datetime) {
                setMsg(((r.data && r.data.error) || "Adding paid items isn't enabled yet.") +
                  " You can still reschedule for free.", "info");
                includeAddonsOnSubmit = false;
                confirmBtn.textContent = "Reschedule only (no charge)";
                confirmBtn.disabled = false;
              } else {
                setMsg((r.data && r.data.error) || "Adding paid items isn't enabled yet.", "info");
                confirmBtn.disabled = false;
              }
              return;
            }
            setMsg((r.data && r.data.error) || "Could not apply changes.", "error");
            confirmBtn.disabled = false;
          } catch (e) {
            setMsg("Could not apply changes.", "error");
            confirmBtn.disabled = false;
          }
        }

        confirmBtn.addEventListener("click", function () { submit(includeAddonsOnSubmit); });
        updateDelta();
        return box;
      }
    })();
  </script>
  <script src="/scripts/nav-account.js"></script>
</body>
</html>
